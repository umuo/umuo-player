name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
            python3 tools/release_metadata.py --tag "$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            python3 tools/release_metadata.py >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # GitHub hosted Ubuntu/macOS runners already include the Android command-line tools.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee "$RUNNER_TEMP/sdk-setup.log"
      - name: SDK failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/sdk-setup.log" ]]; then
            tail -n 50 "$RUNNER_TEMP/sdk-setup.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UMUO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secrets; see docs/RELEASING.md'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umuo-release.jks"
      - name: Test, lint and build signed APKs
        env:
          UMUO_KEYSTORE_PATH: ${{ runner.temp }}/umuo-release.jks
          UMUO_KEYSTORE_PASSWORD: ${{ secrets.UMUO_KEYSTORE_PASSWORD }}
          UMUO_KEY_ALIAS: ${{ secrets.UMUO_KEY_ALIAS }}
          UMUO_KEY_PASSWORD: ${{ secrets.UMUO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PenableAppleTargets=false :shared:jvmTest :playback-media3:testDebugUnitTest :app-mobile:assembleRelease :app-tv:assembleRelease :app-mobile:lintRelease :app-tv:lintRelease
      - name: Verify and collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: python3 tools/collect_release.py --version "$VERSION" --code "$VERSION_CODE" --output dist/release-assets
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-apks-${{ steps.version.outputs.version }}
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/umuo-release.jks"
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-apks-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          手机/平板请选择 mobile-release.apk，电视请选择 tv-release.apk。
          首次从历史 debug 安装切换需卸载旧版，会清除本地配置与记录；后续发行版可覆盖升级。
          这是技术验证版本，真实服务器及设备兼容限制请参阅仓库 docs/VERIFICATION.md。
          NOTES
          gh release create "$TAG" ./*.apk SHA256SUMS --verify-tag --title "Umuo Player $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes "${flags[@]}"
