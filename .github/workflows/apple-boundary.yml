name: Apple Boundary (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-boundary:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkTvosSimulatorArm64
      - run: xcodebuild -project apple-probe/UmuoProbe.xcodeproj -target UmuoProbe-iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apple-probe/UmuoProbe.xcodeproj -target UmuoProbe-tvOS -sdk appletvsimulator CODE_SIGNING_ALLOWED=NO build
