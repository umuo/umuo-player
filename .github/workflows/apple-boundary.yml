name: Apple Boundary (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-boundary:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # GitHub hosted Ubuntu/macOS runners already include the Android command-line tools.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee "$RUNNER_TEMP/sdk-setup.log"
      - name: SDK failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/sdk-setup.log" ]]; then
            tail -n 50 "$RUNNER_TEMP/sdk-setup.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkTvosSimulatorArm64
      - run: xcodebuild -project apple-probe/UmuoProbe.xcodeproj -target UmuoProbe-iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apple-probe/UmuoProbe.xcodeproj -target UmuoProbe-tvOS -sdk appletvsimulator CODE_SIGNING_ALLOWED=NO build
