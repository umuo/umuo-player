name: Verify Spike
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # GitHub hosted Ubuntu/macOS runners already include the Android command-line tools.
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee "$RUNNER_TEMP/sdk-setup.log"
      - name: SDK failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/sdk-setup.log" ]]; then
            tail -n 50 "$RUNNER_TEMP/sdk-setup.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: python3 tools/release_metadata.py
      - run: ./gradlew --no-daemon -PenableAppleTargets=false :shared:jvmTest :playback-media3:testDebugUnitTest :app-mobile:assembleDebug :app-tv:assembleDebug :app-mobile:lintDebug :app-tv:lintDebug
      - name: Verify R8 release build and lint
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/verify-ephemeral.jks"
          cleanup() {
            rm -f "$ks"
            rm -f app-*/build/outputs/apk/release/*.apk
          }
          trap cleanup EXIT
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 \
            -storepass verify-ephemeral -keypass verify-ephemeral \
            -alias verify -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Umuo CI Verify"
          UMUO_KEYSTORE_PATH="$ks" \
          UMUO_KEYSTORE_PASSWORD=verify-ephemeral \
          UMUO_KEY_ALIAS=verify \
          UMUO_KEY_PASSWORD=verify-ephemeral \
          ./gradlew --no-daemon -PenableAppleTargets=false :app-mobile:assembleRelease :app-tv:assembleRelease :app-mobile:lintRelease :app-tv:lintRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app-mobile/build/outputs/apk/debug/*.apk
            app-tv/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-check-reports
          retention-days: 7
          path: |
            shared/build/reports/tests/jvmTest/
            playback-media3/build/reports/tests/testDebugUnitTest/
            app-*/build/reports/lint-results-*.*
